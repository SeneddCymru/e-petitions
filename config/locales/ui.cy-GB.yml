          <h1 class="page-title">Y map deisebau</h1>
          <p>Nodwch y bydd cyfanswm nifer y llofnodion ar gyfer etholaethau, rhanbarthau etholiadol a gwledydd unigol yn llai na chyfanswm nifer y llofnodion a nodwyd ar gyfer y ddeiseb am y rhesymau a ganlyn:</p>
          <ul class="list-bullet">
            <li>Cafodd y ddeiseb ei llofnodi gan ddefnyddio cod post nad yw wedi’i gyhoeddi eto;</li>
            <li>Cafodd y ddeiseb ei llofnodi o’r tu allan i Gymru;</li>
            <li>Cafodd llofnodion papur ychwanegol eu hychwanegu at y ddeiseb.</li>
          </ul>
          <p>Er mwyn cyfrifo dosbarthiad y llofnodion a dangos y ffiniau ar y map, defnyddiwyd y ffynonellau data a ganlyn:</p>
          <ul class="list-bullet">
            <li>Data ynghylch ffiniau gan yr <a href="https://osdatahub.os.uk/downloads/open/BoundaryLine">Arolwg Ordnans</a> a <a href="https://geoportal.statistics.gov.uk">Phorth Daearyddiaeth Agored y Swyddfa Ystadegau Gwladol</a>.</li>
            <li>Data ynghylch codau post o <a href="https://geoportal.statistics.gov.uk/datasets/ons-postcode-directory-november-2021">Gyfeiriadur Codau Post y Swyddfa Ystadegau Gwladol (ONSPD)</a>.</li>
            <li>Daw’r data ynghylch amcangyfrifon poblogaeth (canol 2021) o <a href="https://gov.wales/data-senedd-cymru-constituency-areas-2021">Lywodraeth Cymru</a> a’r <a href="https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/datasets/populationestimatesforukenglandandwalesscotlandandnorthernireland">Swyddfa Ystadegau Gwladol</a>.</li>
