    rules_page:
      body_html: |-
        <h1 class="page-title">Penderfyniad gan y Llywydd o dan Reol Sefydlog 23.3 ynghylch priod ffurf deisebau</h1>

        <p>Diweddarwyd Mawrth 2026</p>

        <p>Mae’r Llywydd wedi gwneud y penderfyniad canlynol ynghylch priod ffurf deisebau’r cyhoedd a gyflwynir o dan Reol Sefydlog 23.</p>

        <ol class="list-number">
          <li>
            <h2>Dull a fformat ar gyfer cyflwyno</h2>
            <p>Gellir cyflwyno deisebau ar bapur neu’n electronig drwy ddefnyddio system ddeisebau ar-lein y Senedd. Gall deisebau gasglu llofnodion am gyfnod o hyd at chwe mis.</p>
            <p>Ar gyfer deiseb bapur, dylai geiriad y ddeiseb gael ei nodi’n llawn ar bob dalen (neu ochr dalen) lle gofynnir am lofnodion. Mae templed ar gael ar gais, a dim ond llofnodion ar bapur a gyflwynir yn y fformat cywir a dderbynnir.</p>
          </li>

          <li>
            <h2>Geiriad</h2>
            <p>Dylid cyflwyno deisebau yn ddidwyll. Dylent alw ar y Senedd neu Lywodraeth Cymru i gymryd camau penodol.</p>
          </li>

          <li>
            <h2>Gofynion sylfaenol</h2>
            <p>Mae’n rhaid i ddeisebau nodi’r canlynol yn glir:</p>
            <ul class="list-bullet">
              <li>enw’r deisebydd, a all fod yn unigolyn neu’n sefydliad;</li>
              <li>cyfeiriad y deisebydd, sy’n gorfod bod yng Nghymru, ar gyfer anfon pob gohebiaeth ynghylch y ddeiseb;</li>
              <li>llofnodion gan o leiaf 250 o bobl sy’n cefnogi’r ddeiseb ac enwau a chyfeiriadau’r bobl hynny.</li>
            </ul>
            <p>Ni ddylai deisebau:</p>
            <ul class="list-bullet">
              <li>gynnwys iaith sy’n peri tramgwydd, sy’n eithafol neu sy’n herfeiddiol. Mae hyn yn cynnwys rhegfeydd a geiriau sarhaus amlwg, ac unrhyw iaith y byddai person rhesymol yn ei ystyried yn dramgwyddol;</li>
              <li>gofyn i’r Senedd wneud unrhyw beth y mae’n eglur nad oes gan y Senedd bŵer i’w wneud (yn benodol nid yw deisebau ynghylch materion sydd heb eu datganoli yn dderbyniadwy);</li>
              <li>bod yr un fath, neu i raddau helaeth yr un fath, â deiseb sy’n casglu llofnodion, dan ystyriaeth gan y Pwyllgor neu a gaewyd lai na blwyddyn yn gynt.</li>
            </ul>
            <p>Rhaid i’r deisebau gydymffurfio mewn ffyrdd eraill â’r penderfyniad hwn.</p>
          </li>

          <li>
            <h2>Ffactorau eraill sy’n ymwneud â derbyniadwyedd</h2>
            <p>Nid yw deisebau sy’n cynnwys y canlynol neu’n gofyn i’r Senedd ystyried y canlynol yn dderbyniadwy:</p>
            <ul class="list-bullet">
              <li>ymyrryd ym mhenderfyniadau gweithrediadol neu gamau gweithredu awdurdodau lleol ac Awdurdodau Parciau Cenedlaethol;</li>
              <li>ymyrryd ym mhenderfyniadau gweithrediadol neu gamau gweithredu unrhyw awdurdod perthnasol sy’n gyfrifol am benderfynu ar geisiadau am ganiatâd cynllunio neu gydsyniad seilwaith yng Nghymru, neu geisio herio neu wrthdroi penderfyniad o’r fath;</li>
              <li>gofyn am benodi unigolyn i rôl neu swydd neu ei symud oddi arno, ymddiswyddo, neu am bleidlais o ddiffyg hyder;</li>
              <li>dyfarnu, cyflafareddu neu gyfryngu o ran buddiannau personol neu fasnachol (swyddogaeth llys neu dribiwnlys yw hyn);</li>
              <li>materion ‘sub judice’ (yn amodol ar weithdrefnau cyfreithiol yn y llysoedd);</li>
              <li>materion sydd eisoes yn destun dyfarniad gan ombwdsmon (neu berson sydd â phwerau tebyg).</li>
            </ul>
            <p>Ni ddylai deisebau gynnwys:</p>
            <ul class="list-bullet">
              <li>datganiadau ffug neu ddifrïol posibl;</li>
              <li>gwybodaeth a waherddir rhag cael ei chyhoeddi gan orchymyn llys neu gorff neu berson sydd â phŵer tebyg;</li>
              <li>deunydd sydd o bosibl yn gyfrinachol, yn fasnachol sensitif, neu a all beri trallod personol neu golled;</li>
              <li>unrhyw gymeradwyaeth fasnachol, hyrwyddo unrhyw gynnyrch, gwasanaeth neu gyhoeddiad neu ddatganiadau sy’n gyfystyr â hysbysebion;</li>
              <li>enwau swyddogion cyrff cyhoeddus, oni bai eu bod yn uwch reolwyr yn y sefydliadau hynny;</li>
              <li>enwau aelodau teuluoedd cynrychiolwyr etholedig neu swyddogion cyrff cyhoeddus;</li>
              <li>enwau unigolion, neu wybodaeth y gellir ei defnyddio i’w hadnabod, mewn perthynas â chyhuddiadau troseddol;</li>
              <li>materion lle nad deiseb yw’r sianel briodol (er enghraifft, gohebiaeth am fater personol).</li>
            </ul>
          </li>

          <li>
            <h2>Ceisiadau Rhyddid Gwybodaeth</h2>
            <p>Ni chaniateir deisebau sydd, yn eu hanfod, yn geisiadau rhyddid gwybodaeth. Mae trefniadau penodol eraill ar gyfer ceisiadau rhyddid gwybodaeth.</p>
          </li>

          <li>
            <h2>Achosion Ombwdsmon Gwasanaethau Cyhoeddus Cymru</h2>
            <p>Ni chaniateir deisebau sy’n gwneud honiadau ynghylch achosion penodol o gamweinyddu neu fethiant gwasanaeth gan gyrff cyhoeddus. Yn yr achosion hyn, cynghorir deisebwyr i gysylltu â’r Ombwdsmon i ystyried eu pryderon.</p>
          </li>
        </ul>
    accessibility_page:
      body_html: |-
        <h1 class="page-title">Datganiad ynghylch hygyrchedd</h1>

        <p><strong>Rydym wedi ymrwymo i wneud y wefan hon yn hygyrch fel y gall cynifer o bobl â phosibl ei defnyddio.</strong></p>

        <p>Mae’r datganiad hwn yn berthnasol i gynnwys a gyhoeddir ar wefan Deisebau, Senedd Cymru.</p>

        <p>Senedd Cymru sydd berchen ar y parth hwn (cyfeirir ati o hyn ymlaen fel y Senedd).</p>

        <p>Ein nod yw sicrhau bod y wefan hon yn hygyrch i’r gynulleidfa ehangaf bosibl. Ystyr hyn yw y dylech, er enghraifft, allu:</p>

        <ul class="list-bullet">
          <li>newid lliwiau, lefelau cyferbyniad a ffontiau</li>
          <li>chwyddo hyd at 300% heb i’r testun fynd oddi ar y sgrin</li>
          <li>llywio’r wefan gan ddefnyddio bysellfwrdd</li>
          <li>llywio’r wefan gan ddefnyddio meddalwedd adnabod lleferydd</li>
          <li>gwrando ar y wefan gan ddefnyddio darllenydd sgrin</li>
        </ul>

        <h2>Beth rydyn ni’n ei wneud i wella hygyrchedd</h2>

        <p>Er mwyn gwneud gwefannau’r Senedd yn hygyrch, rydym yn:</p>

        <ul class="list-bullet">
          <li>integreiddio hygyrchedd i’n gweithdrefnau caffael</li>
          <li>darparu hyfforddiant hygyrchedd i’n staff</li>
          <li>cynnwys unigolion ag anableddau wrth ddylunio ein gwedd allanol.</li>
        </ul>

        <h2>Pa mor hygyrch yw’r wefan hon?</h2>

        <p>Dylai’r wefan hon fod yn gwbl hygyrch.</p>

        <h2>Sut i ofyn am gynnwys mewn fformat gwahanol</h2>

        <p>Os oes angen gwybodaeth arnoch mewn fformat gwahanol, cysylltwch â ni a dywedwch wrthym:</p>

        <ul class="list-bullet">
          <li>cyfeiriad gwe (URL) y cynnwys sydd ei angen arnoch chi</li>
          <li>Eich enw a’ch cyfeiriad e-bost a’r</li>
          <li>math o fformat sydd ei angen arnoch</li>
        </ul>

        <h2>Rhoi gwybod am broblemau hygyrchedd gyda’r wefan hon</h2>

        <p>Os cewch unrhyw broblemau neu os credwch nad ydym yn bodloni’r gofynion o ran hygyrchedd, <a href="/adborth">cysylltwch â ni</a> i roi gwybod.</p>

        <h2>Gweithdrefn orfodi</h2>

        <p>Os byddwch yn cysylltu â ni gyda chwyn ac nad ydych yn fodlon â’r ymateb, cysylltwch â’r Gwasanaeth Cynghori a Chymorth o ran Cydraddoldeb (EASS).</p>

        <p>Y Comisiwn Cydraddoldeb a Hawliau Dynol sy’n gyfrifol am orfodi Rheoliadau Hygyrchedd Cyrff y Sector Cyhoeddus (Gwefannau a Rhaglenni Ffonau Symudol) (Rhif 2) 2018 (y ‘rheoliadau hygyrchedd’).</p>

        <h2>Gwybodaeth dechnegol am hygyrchedd y wefan hon</h2>

        <p>Mae’r Senedd wedi ymrwymo i wneud y wefan hon yn hygyrch, yn unol â Rheoliadau Hygyrchedd Cyrff y Sector Cyhoeddus (Gwefannau a Rhaglenni Ffonau Symudol) (Rhif 2) 2018.</p>

        <h2>Statws cydymffurfio</h2>

        <p>Mae’r wefan hon yn cydymffurfio â safon 2.1 AA o’r Canllawiau Hygyrchedd Cynnwys y We.</p>

        <h2>Sut wnaethon ni brofi’r wefan hon</h2>

        <p>Mae ein gwefannau wedi’u profi, a pharheir i’w profi ar hyn o bryd, ar gyfer cydymffurfio â safon V2.1 lefel A a lefel AA o’r Canllawiau Hygyrchedd Cynnwys y We gan ddefnyddio cyfuniad o offer awtomataidd o ran safonau hygyrchedd WCAG 2.0.</p>

        <h2>Paratoi’r datganiad hygyrchedd hwn</h2>

        <p>Paratowyd y datganiad hwn ar 12 Tachwedd 2020.</p>

        <p>Profir y wefan hon yn barhaus drwy gyfuniad o offer hygyrchedd.</p>

