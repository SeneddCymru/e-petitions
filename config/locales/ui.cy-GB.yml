    privacy_page:
      body_html: |-
        <h1>Preifatrwydd a chwcis</h1>

        <section id="privacy" aria-labelledby="privacy-heading">
          <h2 id="privacy-heading">Hysbysiad preifatrwydd: sut y byddwn eich gwybodaeth yn cael ei defnyddio</h2>

          <p>Diweddarwyd ddiwethaf: Mehefin 2026</p>

          <p>Mae’r wefan Deisebau yn eich galluogi i ddechrau a llofnodi deisebau i godi materion gyda Senedd Cymru (y cyfeirir ati fel y Senedd o hyn ymlaen).</p>

          <p>Darperir y gwasanaeth deisebau gan Gomisiwn y Senedd. Mae angen i ni gasglu, prosesu a storio rhai data personol i’ch galluogi i wneud hyn.</p>

          <h3>Rheolwr data</h3>

          <p>Comisiwn y Senedd yw rheolwr data’r wybodaeth rydych chi’n ei rhoi, a bydd yn sicrhau y caiff ei diogelu a’i defnyddio yn unol â chyfraith diogelu data y DU.</p>

          <h3>Ein manylion cyswllt</h3>

          <p>Dylid anfon ymholiadau am y ffordd y caiff eich gwybodaeth ei defnyddio gennym at y Swyddog Diogelu Data:</p>

          <p><a href="mailto:Digoelu.Data@senedd.cymru">Digoelu.Data@senedd.cymru</a> 0300 2006565</p>

          <h3>Pa wybodaeth rydym yn ei phrosesu?</h3>

          <p>Bydd y data personol y byddwn ni’n eu casglu gan bobl sy’n llofnodi deisebau yn cynnwys y canlynol:</p>

          <ul class="list-bullet">
            <li>eich enw</li>
            <li>eich cyfeiriad e-bost</li>
            <li>eich cod post</li>
            <li>y wlad rydych chi’n byw ynddi</li>
            <li>y cyfeiriad IP rydych chi’n ei ddefnyddio wrth ddechrau neu lofnodi deiseb</li>
          </ul>

          <p>Yn ogystal, ar gyfer pobl sy’n cychwyn deiseb byddwn hefyd yn casglu’r canlynol:</p>

          <ul class="list-bullet">
            <li>eich cyfeiriad cartref</li>
            <li>eich rhif ffôn ar gyfer cysylltu</li>
            <li>Unrhyw wybodaeth neu fanylion personol rydych yn ei darparu yn y ddeiseb ei hun.</li>
          </ul>

          <p>Weithiau, rydym ni’n cael gwybodaeth sy’n ymwneud â phobl sydd wedi llofnodi deisebau ar bapur. Mae deisebau papur yn cael eu storio a’u cadw’n ddiogel am yr un cyfnod â data personol a dderbynnir trwy ein system deisebau electronig ein hunain. Byddant yn cael eu dinistrio mewn modd diogel ar ddiwedd y cyfnod cadw.</p>

          <h3>Pam rydym yn ei phrosesu?</h3>

          <p>Rydym ni’n defnyddio’r wybodaeth hon er mwyn:</p>

          <ul class="list-bullet">
            <li>hwyluso’r broses ddeisebu</li>
            <li>sicrhau mai dim ond unwaith y bydd pobl yn llofnodi deiseb</li>
            <li>gwirio eich bod chi’n gymwys i ddechrau deiseb</li>
            <li>cysylltu â chi ynghylch deisebau rydych chi’n eu dechrau</li>
            <li>os ydych chi’n dewis cofrestru i gael y wybodaeth ddiweddaraf am beth sy’n digwydd yn y Senedd ynghylch deisebau rydych chi wedi’u llofnodi</li>
            <li>efallai y byddwn yn cysylltu o bryd i’w gilydd â phobl sy’n cychwyn neu’n cyflwyno deisebau i ofyn am adborth ar y broses ddeisebu a sut y gellid ei gwella.</li>
          </ul>

          <h3>Beth rydym ni’n ei wneud gyda’ch data</h3>

          <p>Rydym yn defnyddio eich gwybodaeth bersonol i brosesu’r ddeiseb rydych wedi’i dechrau neu ei llofnodi.</p>

          <p>Defnyddir cyfeiriadau IP i amddiffyn y wefan ddeisebau ac atal gweithgarwch twyllodrus.</p>

          <p>Byddwn ni’n rhannu’ch data os bydd yn ofynnol i ni wneud hynny yn ôl y gyfraith – er enghraifft, drwy orchymyn llys, neu i atal twyll neu droseddau eraill.</p>

          <p>Os ydych chi wedi llofnodi deiseb, ni fyddwn ni’n cyhoeddi gwybodaeth bersonol amdanoch chi.</p>

          <p>Byddwn ni’n defnyddio’ch cod post i gyfrifo faint o bobl yng Nghymru ac o bob un o etholaethau’r Senedd sydd wedi llofnodi deiseb.</p>

          <p>Byddwn yn cadw eich data personol o’r dyddiad y byddwch yn dechrau neu’n llofnodi deiseb tan 12 mis ar ôl iddi beidio â chael ei hystyried gan y Pwyllgor Deisebau mwyach, h.y. tan 12 mis ar ôl i’r Pwyllgor ystyried bod y ddeiseb wedi’i chwblhau, ar wahân i unrhyw ddata personol sydd wedi’i gyhoeddi.</p>

          <h3>Beth fyddwn ni’n ei anfon atoch dros e-bost</h3>

          <p>Os bydd deiseb rydych chi wedi’i dechrau’n cael ei chyfeirio i’r Pwyllgor Deisebau, byddwn ni’n defnyddio’ch manylion cyswllt i roi’r wybodaeth ddiweddaraf i chi am hynt y ddeiseb ac i gynnig cyfle i chi roi rhagor o wybodaeth ac ymgysylltu â’r Pwyllgor.</p>

          <p>Byddwch yn derbyn negeseuon e-bost cadarnhau awtomataidd pan fyddwch chi’n dechrau neu’n llofnodi deiseb. Os ydych wedi llofnodi deiseb, gallwch ddewis cael y wybodaeth ddiweddaraf am hynt y ddeiseb.</p>

          <p>Gallai hyn gynnwys cysylltu â chi i roi gwybod i chi beth sy’n digwydd yn y Senedd mewn perthynas â’ch deiseb, er enghraifft:</p>

          <ul class="list-bullet">
            <li>dadleuon y gallwch eu gwylio neu eu darllen,</li>
            <li>cyfleoedd i ymateb i ymgynghoriad,</li>
            <li>neu ffyrdd o roi gwybod i bwyllgorau ac Aelodau o’r Senedd pam bod y ddeiseb yn bwysig i chi.</li>
          </ul>

          <p>Efallai y byddwn ni’n defnyddio eich manylion cyswllt yn achlysurol i geisio eich barn am broses ddeisebau’r Senedd.</p>

          <p>Gallwch chi stopio’r negeseuon hyn unrhyw bryd drwy glicio ar y linc “dad-danysgrifio” yn yr e-bost.</p>

          <h3>Pwy fydd yn gallu cael mynediad at y wybodaeth?</h3>

          <p>Dim ond staff cyfyngedig Comisiwn y Senedd sy’n gweinyddu’r broses ddeisebu fydd â mynediad at eich gwybodaeth bersonol.</p>

          <h3>A fydd y wybodaeth yn cael ei rhannu â thrydydd partïon, neu’n cael ei chyhoeddi?</h3>

          <p>Os ydych chi’n dechrau deiseb ac rydym ni’n ei derbyn, caiff eich enw ei gyhoeddi ochr yn ochr ag unrhyw destun rydych yn ei gynnwys gyda’r ddeiseb. Ni fyddwn yn cyhoeddi eich manylion cyswllt. Os byddwch chi’n dechrau deiseb, bydd eich enw’n parhau i ymddangos yn barhaol ochr yn ochr â’r ddeiseb ar dudalennau gwe’r Pwyllgor Deisebau ac mewn trawsgrifiadau a chofnodion cyfarfodydd, fel rhan o gofnod swyddogol proses ddeisebau’r Senedd. Bydd unrhyw wybodaeth sydd wedi’i chyhoeddi yn aros ar-lein yn barhaol yng nghofnodion proses ddeisebau’r Senedd, gan gynnwys mewn unrhyw ddeunydd a gyhoeddir gan y Pwyllgor Deisebau.</p>

          <h4>Proseswyr trydydd parti:</h4>

          <p>Bydd gan Unboxed Consulting Limited sy’n darparu cymorth technegol ar gyfer y system ddeisebau fynediad i’r system at ddibenion datrys problemau a chynnal a chadw yn unig.</p>

          <p>Mae’r system ddeisebau yn defnyddio storfa cwmwl Amazon Web Services (AWS) i storio eich data. Mae AWS yn storio data o fewn yr Ardal Economaidd Ewropeaidd (AEE).</p>

          <p>Bydd y wybodaeth yn cael ei storio’n ddiogel ar ein systemau TGCh, sy’n cynnwys gwasanaethau cwmwl trydydd parti a ddarperir gan Microsoft. Efallai y byddwn hefyd yn defnyddio technoleg deallusrwydd artiffisial Microsoft i brosesu eich gwybodaeth. Mae unrhyw drosglwyddo data gan Microsoft y tu allan i’r AEE yn dod o dan gymalau cytundebol lle mae Microsoft yn sicrhau bod data personol yn cael eu trin yn unol â deddfwriaeth ddomestig. I gael rhagor o wybodaeth am sut y bydd Microsoft yn defnyddio eich gwybodaeth, gellir darllen datganiad preifatrwydd y cwmni <a href="https://www.microsoft.com/en-gb/trust-center/privacy">yma</a>.</p>

          <p>Mae’r system ddeisebau yn defnyddio’r gwasanaeth GOV.UK Notify i anfon negeseuon e-bost sy’n ymwneud â’r broses ddeisebu gan gynnwys y wybodaeth ddiweddaraf. Mae negeseuon e-bost a anfonir yn cael eu storio am 7 diwrnod.  Mae’r hysbysiad preifatrwydd ar gyfer gwasanaeth GOV.UK Notify ar gael yma: <a href="https://www.notifications.service.gov.uk/privacy">www.notifications.service.gov.uk/privacy</a>.</p>

          <h3>Storio, cadw a dileu</h3>

          <p>Bydd y wybodaeth yn cael ei storio’n ddiogel ar ein systemau TGCh, sy’n cynnwys gwasanaethau cwmwl trydydd parti a ddarperir gan Microsoft.</p>

          <p>Byddwn yn cadw eich data personol o’r dyddiad y byddwch yn dechrau neu’n llofnodi deiseb tan 12 mis ar ôl iddi beidio â chael ei hystyried gan y Pwyllgor Deisebau mwyach, h.y. tan 12 mis ar ôl i’r Pwyllgor ystyried bod y ddeiseb wedi’i chwblhau, ar wahân i unrhyw ddata personol sydd wedi’i gyhoeddi.</p>

          <p>Ar ôl y cyfnod hwn o 12 mis, bydd eich data personol yn cael ei ddileu’n ddiogel.</p>

          <h3>Y sail gyfreithiol ar gyfer prosesu Data Personol</h3>

          <p>Mae cyfraith diogelu data’r DU yn nodi amryw o seiliau cyfreithiol sy’n caniatáu i ni gasglu, cadw a defnyddio eich gwybodaeth bersonol. At ddibenion prosesu’r data personol a ddarperir gennych, rydym yn dibynnu ar y seiliau cyfreithiol a ganlyn:</p>

          <h4>Erthygl 6(1)(e) o Reoliad Diogelu Data Cyffredinol y DU (‘GDPR y DU’): ‘Tasg gyhoeddus’</h4>

          <p>Rydym o’r farn ei bod hi’n angenrheidiol i ni gasglu a defnyddio eich gwybodaeth er mwyn ein helpu i hwyluso’r broses ddeisebu a rhoi cyfle i’r cyhoedd godi materion gyda’r Senedd a dangos cefnogaeth iddynt. Dylid darllen ein dibyniaeth ar y sail gyfreithiol hon ynghyd ag adran 8(d) o Ddeddf Diogelu Data 2018 (‘DPA 2018’).</p>

          <h4>Erthygl 6(1)(c) o GDPR y DU: ‘Rhwymedigaeth gyfreithiol’</h4>

          <p>Pan fo’n ofynnol i ni brosesu data personol er mwyn cydymffurfio â rhwymedigaeth gyfreithiol, megis cais o dan ddeddfwriaeth mynediad at wybodaeth neu orchymyn llys, byddwn yn gwneud hynny ar y sail bod prosesu yn angenrheidiol er mwyn cydymffurfio â rhwymedigaeth gyfreithiol.</p>

          <p>Mae’n bosibl y byddwn yn prosesu data personol sy’n ymwneud ag euogfarnau troseddol a throseddau. Er mwyn cydymffurfio ag Erthygl 10 o GDPR y DU, bydd y data hwn yn cael ei brosesu yn unol â’n sail gyfreithiol Erthygl 6, fel yr amlinellwyd uchod, ac adran 10 o, a pharagraff 6 o Atodlen 1 i, DPA 2018.</p>

          <h3>Y sail gyfreithiol ar gyfer prosesu Data Categori Arbennig</h3>

          <p>Mae Erthygl 9(1) o’r Rheoliad Cyffredinol ar Ddiogelu Data (GDPR) yn diffinio data personol categori arbennig fel data personol sy’n datgelu tarddiad o ran hil neu ethnigrwydd, barn wleidyddol, credoau crefyddol neu athronyddol, neu aelodaeth o undeb llafur, a phrosesu data genetig, data biometrig i adnabod person naturiol yn unigryw, data sy’n ymwneud ag iechyd neu ddata sy’n ymwneud â bywyd rhywiol neu gyfeiriadedd rhywiol person naturiol.</p>

          <p>Bydd data personol categori arbennig fel arfer yn cael ei brosesu ar y sail ei fod yn angenrheidiol am resymau sydd o ddiddordeb sylweddol i’r cyhoedd, yn unol ag Erthygl 9(2)(g) o Reoliad Cyffredinol ar Ddiogelu Data y DU, a ddarllenir ar y cyd ag adran 10 o, a pharagraff 6 o Atodlen 1 i, Deddf Diogelu Data 2018. Fodd bynnag, pan fo eich data personol categori arbennig yn cael ei gyhoeddi gennych chi, gellir ei brosesu ar y sail ei fod eisoes wedi’i gyhoeddi’n amlwg gennych chi, yn unol ag Erthygl 9(2)(e) o’r GDPR.</p>

          <h3>Rhannu data</h3>

          <p>Os gwneir cais am wybodaeth o dan ddeddfwriaeth mynediad at wybodaeth, mae’n bosibl y bydd angen datgelu’r cyfan neu rywfaint o’r wybodaeth a ddarperir gennych.  Dim ond os yw’r gyfraith yn dweud bod yn rhaid inni rannu’r wybodaeth y byddwn yn gwneud hynny.</p>

          <h3>Eich hawliau</h3>

          <p>Fel testun y data, mae gennych nifer o hawliau. Mae’r hawliau sy’n gymwys yn dibynnu ar y seiliau cyfreithiol yr ydym yn dibynnu arnynt i ddefnyddio eich gwybodaeth bersonol. Ni fydd yr hawliau hynny’n gymwys ym mhob achos, a bydd y Comisiwn yn cadarnhau a ydynt yn gymwys ai peidio pan fyddwch yn gwneud cais.</p>

          <p>Mae’r hawliau’n cynnwys yr hawl i ofyn am fynediad at eich gwybodaeth bersonol eich hun, a elwir weithiau’n ‘gais am fynediad gan destun y data’.</p>

          <p>Hefyd, mae gennych hawl i ofyn i ni wneud y canlynol:</p>

          <ul class="list-bullet">
            <li>cywiro unrhyw wybodaeth anghywir sydd gennym amdanoch (sylwer bod gofyn i chi roi gwybod i ni am unrhyw newidiadau o ran eich gwybodaeth bersonol);</li>
            <li>dileu gwybodaeth amdanoch (o dan amgylchiadau penodol);</li>
            <li>ein bod yn rhoi’r gorau i ddefnyddio eich gwybodaeth bersonol at ddibenion penodol neu mewn rhai amgylchiadau; a</li>
            <li>bod eich gwybodaeth yn cael ei darparu i chi neu drydydd parti mewn fformat cludadwy (eto, o dan rai amgylchiadau).</li>
          </ul>

          <p>Os hoffech chi arfer unrhyw un o’r hawliau sydd gennych o dan ddeddfwriaeth diogelu data, gofyn cwestiwn, neu wneud cwyn am sut mae eich gwybodaeth yn cael ei defnyddio, anfonwch e-bost at ceisiadau-gwybodaeth@senedd.cymru.</p>

          <h3>Cwyno</h3>

          <p>Gallwch gwyno i’r Swyddog Diogelu Data os ydych yn anfodlon ar sut rydym wedi defnyddio eich data. Ceir y manylion cyswllt uchod.</p>

          <p>Os byddwch yn dal i fod yn anfodlon ar ein hymateb ar ôl gwneud cwyn, gallwch hefyd gwyno i Swyddfa’r Comisiynydd Gwybodaeth (ICO).</p>

          <p>Cyfeiriad Swyddfa’r Comisiynydd Gwybodaeth:</p>

          <p>
            Information Commissioner’s Office<br>
            Wycliffe House<br>
            Water Lane<br>
            Wilmslow<br>
            Cheshire<br>
            SK9 5AF
          </p>

          <p>
            Rhif y llinell gymorth: 0303 123 1113<br>
            <a href="mailto:casework@ico.org.uk">casework@ico.org.uk</a>
          </p>

          <h3>Newidiadau i’r hysbysiad hwn</h3>

          <p>Gallwn newid yr hysbysiad preifatrwydd hwn. Yn yr achos hwnnw, bydd y dyddiad ‘diweddarwyd ddiwethaf’ ar frig y dudalen hon hefyd yn newid. Bydd unrhyw newid i’r hysbysiad preifatrwydd hwn yn gymwys i chi a’ch data ar unwaith. Os yw’r newidiadau hyn yn effeithio ar y ffordd y caiff eich data personol eu prosesu, byddwn ni’n cymryd camau rhesymol i sicrhau y cewch chi wybod.</p>
        </section>

        <section id="cookies" aria-labelledby="cookies-heading">
          <h2 id="cookies-heading">Cwcis</h2>

          <p>Mae’r wefan hon yn rhoi ffeiliau bach (o’r enw ‘cwcis’) ar eich cyfrifiadur i gasglu gwybodaeth am y ffordd rydych chi’n pori’r wefan.</p>

          <p>Defnyddir cwcis er mwyn:</p>

          <ul class="list-bullet">
            <li>mesur y ffordd rydych chi’n defnyddio’r gwasanaeth deisebau er mwyn ei ddiweddaru a’i wella ar sail eich anghenion</li>
            <li>cofio’r hysbysiadau rydych chi wedi’u gweld fel na fyddwn ni’n eu dangos i chi eto</li>
            <li>helpu i atal pobl rhag llofnodi deisebau drwy dwyll</li>
          </ul>

          <p>Mae rhai cwcis yn hollol angenrheidiol er mwyn sicrhau y caiff y wefan hon ei chynnal yn ddiogel. Ni chân nhw eu defnyddio i’ch adnabod chi’n bersonol.</p>

          <p>Rhagor o wybodaeth am <a href="https://www.aboutcookies.org/">sut i reoli cwcis</a>.</p>


          <h3>Cwcis Google Analytics</h3>

          <p>Rydym ni’n defnyddio Google Analytics i gasglu gwybodaeth am y ffordd rydych chi’n defnyddio’r gwasanaeth. Mae’r wybodaeth hon yn ein helpu i wella’r gwasanaeth ac atal llofnodi deisebau’n dwyllodrus. Y tro cyntaf y byddwch chi’n mynd i’r wefan ar ddyfais newydd, byddwch chi’n gweld opsiwn i ddewis derbyn cwcis dadansoddol.</p>

          <p>Mae cwci Google Analytics yn casglu ac yn storio gwybodaeth am y canlynol:</p>

          <ul class="list-bullet">
            <li>defnyddwyr unigryw</li>
            <li>hysbysu gwefannau cyfeirio</li>
            <li>nifer y bobl sy’n mynd i’r wefan a nifer y sesiynau</li>
          </ul>

          <table>
            <thead>
              <tr>
                <th>Enw</th>
                <th>Diben</th>
                <th>Dod i ben</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>_ga</td>
                <td>Defnyddir cyfeirnod a gynhyrchir ar hap i adnabod defnyddwyr unigryw a hysbysu gwefannau cyfeirio a chyfrif nifer y bobl sy’n mynd i’r wefan a nifer y sesiynau</td>
                <td>2 flynedd</td>
              </tr>
              <tr>
                <td>_ga_&lt;ID number&gt;</td>
                <td>Yn caniatáu inni ddeall sut mae defnyddwyr yn rhyngweithio â’n gwefannau</td>
                <td>2 flynedd</td>
              </tr>
              <tr>
                <td>_gid</td>
                <td>Yn caniatáu inni ddeall sut mae defnyddwyr yn rhyngweithio â’n gwefannau</td>
                <td>24 awr</td>
              </tr>
            </tbody>
          </table>

          <p>Ni chaniateir i Google ddefnyddio na rhannu ein data dadansoddol â neb, ond cewch chi ddewis peidio â derbyn cwcis Google Analytics.</p>

          <h3>Cwcis sesiwn</h3>

          <p>Rydym ni’n storio cwci sesiwn ar eich cyfrifiadur i helpu i gadw’ch gwybodaeth yn ddiogel wrth i chi ddefnyddio’r gwasanaeth.</p>
          <table>
            <thead>
              <tr>
                <th>Enw</th>
